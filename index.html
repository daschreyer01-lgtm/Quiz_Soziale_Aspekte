<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>Fair-einkaufen-Quiz</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: eine Frage pro Bildschirm, Zeitbalken, Ranking nach Tempo, großer Rang für die Lehrkraft aus der Ferne */
:root{
  --bg:#FBF7F1; --card:#FFFFFF; --fg:#232A38; --muted:#5E6779; --line:#E4DCCF;
  --accent:#E8791A; --accent-ink:#FFFFFF; --ok:#1F8A56; --ok-bg:#DDF3E8; --bad:#C23B3B; --bad-bg:#F9E0DE;
  --ft:#E3DDF2; --gw:#E6EBC8; --fsc:#E4E4E4; --ink-on-tile:#232A38;
  --f-body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1B2130; --card:#272F42; --fg:#F3F1EC; --muted:#B4BCCB; --line:#3A4560;
  --accent:#F28C28; --accent-ink:#1B2130; --ok:#6FDDA6; --ok-bg:#1E4A38; --bad:#FF9D9D; --bad-bg:#5A2B2B;
  --ft:#4B4466; --gw:#4C5436; --fsc:#4A4F5C; --ink-on-tile:#F3F1EC; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1B2130; --card:#272F42; --fg:#F3F1EC; --muted:#B4BCCB; --line:#3A4560;
  --accent:#F28C28; --accent-ink:#1B2130; --ok:#6FDDA6; --ok-bg:#1E4A38; --bad:#FF9D9D; --bad-bg:#5A2B2B;
  --ft:#4B4466; --gw:#4C5436; --fsc:#4A4F5C; --ink-on-tile:#F3F1EC; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:18px;line-height:1.45;
  padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:720px;margin:0 auto}
h1{font-size:34px;line-height:1.1;margin:0 0 6px;font-weight:800;text-wrap:balance}
h2{font-size:24px;line-height:1.2;margin:0 0 12px;font-weight:800;text-wrap:balance}
p{margin:0 0 12px}
.pill{display:inline-block;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:13px;letter-spacing:.08em;text-transform:uppercase;padding:5px 12px;border-radius:99px;margin-bottom:14px}
.card{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:20px}
label{display:block;font-weight:700;margin-bottom:6px}
input[type=text],textarea{width:100%;font:inherit;font-size:20px;padding:14px 16px;border-radius:16px;border:2px solid var(--line);background:var(--bg);color:var(--fg)}
textarea{font-size:16px;font-family:ui-monospace,Menlo,Consolas,monospace;min-height:130px}
input:focus-visible,textarea:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button{font:inherit;font-weight:800;cursor:pointer}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:99px;padding:14px 28px;font-size:19px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--fg);border:2px solid var(--line)}
.dots{display:flex;gap:8px;margin:0 0 18px}
.dot{height:8px;flex:1;border-radius:6px;background:var(--line)}
.dot.now{background:var(--accent)} .dot.ok{background:var(--ok)} .dot.bad{background:var(--bad)}
.stmt{font-size:23px;font-weight:700;line-height:1.35;margin:0 0 18px;text-wrap:balance}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.tiles.two{grid-template-columns:repeat(2,1fr)}
.tile{border:3px solid transparent;border-radius:20px;padding:14px 8px 12px;color:var(--ink-on-tile);display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0;font-size:17px}
.tile img{height:84px;width:auto;max-width:100%;object-fit:contain;background:#fff;border-radius:12px;padding:6px}
.tile.rf{padding:22px 8px;font-size:22px;background:var(--line)}
.tiles.opts{grid-template-columns:1fr}
.tile.opt{background:var(--line);font-size:20px;padding:18px 16px;align-items:flex-start;text-align:left}
.tile:not(:disabled):hover{border-color:var(--accent)}
.tile.pick{border-color:var(--fg)}
.tile.right{border-color:var(--ok);box-shadow:0 0 0 3px var(--ok-bg)}
.tile.wrong{border-color:var(--bad);opacity:.75}
.fb{margin-top:18px;border-radius:18px;padding:16px 18px;display:flex;gap:14px;align-items:flex-start}
.fb.ok{background:var(--ok-bg)} .fb.bad{background:var(--bad-bg)}
.fb svg{flex:none;width:34px;height:34px}
.fb b{display:block;font-size:20px;margin-bottom:2px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:18px}
.score{font-size:64px;font-weight:800;line-height:1;color:var(--accent)}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:26px;font-weight:700;letter-spacing:.04em;background:var(--bg);border:2px dashed var(--accent);border-radius:16px;padding:14px 16px;word-break:break-all}
.small{font-size:15px;color:var(--muted)}
.ladder{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:8px;text-align:left}
.ladder li{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:14px;background:var(--bg);border:2px solid var(--line);font-weight:700}
.ladder li .em{font-size:26px;line-height:1}.ladder li .lv{margin-left:auto;font-size:13px;color:var(--muted)}
.ladder li.me{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent)}
.rankbig{font-size:120px;line-height:1.05}
.rankname{font-size:44px;font-weight:800;color:var(--accent);line-height:1.1;margin:6px 0}
table{border-collapse:collapse;width:100%;font-size:16px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.scroll{overflow-x:auto}
.bar{height:14px;border-radius:8px;background:var(--line);overflow:hidden;min-width:110px}
.bar i{display:block;height:100%;background:var(--accent)}
.mark{display:inline-block;width:22px;text-align:center;font-weight:800}
.mark.ok{color:var(--ok)} .mark.bad{color:var(--bad)}
@media (max-width:480px){.tiles{gap:8px}.tile img{height:64px}.stmt{font-size:20px}h1{font-size:28px}.score{font-size:52px}}
@media (prefers-reduced-motion:no-preference){.card{animation:in .25s ease-out}@keyframes in{from{opacity:.4;transform:translateY(6px)}}}

.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:0 0 10px;font-weight:800}
.top .tot{font-size:22px;color:var(--accent)}
.timer{height:16px;border-radius:10px;background:var(--line);overflow:hidden;margin:0 0 16px}
.timer i{display:block;height:100%;background:var(--accent);transform-origin:left;width:100%}
.timer i.low{background:var(--bad)}
.secs{font-size:15px;color:var(--muted);text-align:right;margin:-10px 0 12px;font-variant-numeric:tabular-nums}
.gain{font-size:30px;font-weight:800;margin-left:auto;white-space:nowrap}
.fb.ok .gain{color:var(--ok)} .fb.bad .gain{color:var(--bad)}
.final{text-align:center;padding:28px 16px}
.final .who{font-size:clamp(28px,7vw,48px);font-weight:800;line-height:1.1;margin:0 0 6px;word-break:break-word}
.final .big{font-size:clamp(110px,30vw,240px);font-weight:800;line-height:.95;color:var(--accent);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.final .unit{font-size:clamp(24px,6vw,40px);font-weight:800;margin:4px 0 0}
.final .sub{font-size:20px;color:var(--muted);margin:14px 0 0}
.wait{font-variant-numeric:tabular-nums}
</style>

  var q=Q[st.i],h='<div class="top"><span>Fair-Quiz</span><span class="tot">'+rk()+'</span></div>'+dots()+'<div class="card"><p class="small" style="margin:0 0 8px">Frage '+(st.i+1)+' von '+Q.length+'</p>';
  h+='<div class="timer" aria-hidden="true"><i id="tb"></i></div><p class="secs" id="secs">'+LIMIT+' s</p>';
  h+='<p class="stmt">'+esc(q.t)+'</p>';
  if(q.img)h+='<p style="margin:0 0 14px"><img src="'+FT+'" alt="Fairtrade-Siegel" style="height:96px;background:#fff;border-radius:12px;padding:6px"></p>';
  if(q.rf===undefined){
    h+='<div class="tiles opts" role="group" aria-label="Antwort wählen">';
    q.o.forEach(function(x,ix){h+='<button class="tile opt" data-v="'+ix+'">'+esc(x)+'</button>'});
    h+='</div>';
  }else{
    h+='<div class="tiles two" role="group" aria-label="Richtig oder falsch"><button class="tile rf" data-v="0">richtig</button><button class="tile rf" data-v="1">falsch</button></div>';
  }
  h+='<div id="fb"></div></div>';
  app.innerHTML=h;
  [].forEach.call(app.querySelectorAll('.tile'),function(b){b.addEventListener('click',function(){pick(+b.dataset.v)})});
  st.t0=performance.now();
  var tb=document.getElementById('tb'),sc=document.getElementById('secs');
  clearInterval(st.tick);
  st.tick=setInterval(function(){
    var el=(performance.now()-st.t0)/1000,r=Math.max(0,LIMIT-el);
    tb.style.width=(100*r/LIMIT)+'%';if(r<5)tb.classList.add('low');
    sc.textContent=Math.ceil(r)+' s';
    if(r<=0)pick(-1);
  },100);
}
function pick(v){
  if(st.locked)return;st.locked=true;clearInterval(st.tick);
  var el=(performance.now()-st.t0)/1000,q=Q[st.i],ok=v>=0&&isOk(st.i,v),kv=key(q);
  var p=ok?Math.max(100,Math.round(MAXP*(1-Math.min(el,LIMIT)/LIMIT))):0;
  st.ans[st.i]=v;st.pts[st.i]=p;
  var o=load()||{};o.name=st.name;o.pts=st.pts.slice();save(o);
  [].forEach.call(app.querySelectorAll('.tile'),function(b){var bv=+b.dataset.v;b.disabled=true;if(bv===kv)b.classList.add('right');else if(bv===v)b.classList.add('wrong')});
  var last=st.i===Q.length-1,title=ok?'Richtig!':(v<0?'Zeit abgelaufen.':'Nicht ganz.');
  document.getElementById('fb').innerHTML='<div class="fb '+(ok?'ok':'bad')+'" role="status">'+(ok?ICON_OK:ICON_BAD)+'<div><b>'+title+'</b>'+esc(q.e)+'</div></div><div class="row"><button class="btn" id="nx">'+(last?'Ergebnis ansehen':'Weiter')+'</button></div>';
  app.querySelector('.dots').outerHTML=dots();
  app.querySelector('.tot').textContent=rk();
  document.getElementById('nx').addEventListener('click',function(){st.locked=false;if(last){var o=load()||{};o.done=true;o.pts=st.pts.slice();save(o);final(o)}else{st.i++;ask()}});
  document.getElementById('nx').focus();
}
function final(o){
  var pts=(o.pts||[]),sum=pts.reduce(function(a,b){return a+b},0),right=pts.filter(function(x){return x>0}).length,r=rankOf(sum);
  app.innerHTML='<div class="card final"><p class="who">Dein Rang</p><div class="rankbig">'+RANKS[r].e+'</div><div class="rankname">'+RANKS[r].n+'</div><p class="sub">Stufe '+(r+1)+' von '+RANKS.length+' · '+right+' von '+Q.length+' Fragen richtig</p>'+ladder(r)+'</div>'+
  '<p class="small wait" id="wt" style="text-align:center;margin-top:16px"></p>';
  var wt=document.getElementById('wt');
  function upd(){var l=left();if(l>0)wt.textContent='Neuer Versuch möglich in '+mmss(l)+' Min.';else{clearInterval(waitT);wt.innerHTML='<button class="btn ghost" id="again">Neuer Versuch</button>';document.getElementById('again').addEventListener('click',start)}}
  clearInterval(waitT);upd();waitT=setInterval(upd,1000);
}
start();
</script>
